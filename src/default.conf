server {
    listen 80;
    listen [::]:80;
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    server_name localhost;
    root /var/www/html/public;
    index index.php;

    # SSL certificate configuration 
    # This is the default symfony Certificate Authority
    # Use it ONLY IN DEV Mode, feel free to replace it
    # FIXED: Pointing to the secure, www-data readable location
    ssl_certificate /etc/ssl/nginx/symfony-ca.pem;
    ssl_certificate_key /etc/ssl/nginx/symfony-ca-key.key;
    
    # Other SSL settings (e.g., ciphers, protocols)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'TLS_AES_128_GCM_SHA256:TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers on;

    # Add Strict-Transport-Security header for enhanced security
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    
    # Specifies the maximum accepted body size of client uploads
    client_max_body_size 128m;

    location / {
        # FIXED: Optimized specifically for Symfony front-controller routing
        try_files $uri /index.php$is_args$args;
        
        # try_files $uri $uri/ /index.php?$query_string;
    }


    # Pass production PHP scripts straight over to the internal PHP-FPM pool
    location ~ ^/index\.php(/|$) {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;

        # FIXED: Enhanced variables to correctly pass modern Symfony routing definitions
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $document_root;

        # Downloading files can easily take longer than 5 minutes.
        fastcgi_read_timeout 300s;
        fastcgi_send_timeout 300s;
        fastcgi_connect_timeout 300s;
        
        # Prevents uri injection processing bugs on upstream files
        internal;
    }

    # Return 404 for all other php files to secure your backend source code
    location ~ \.php$ {
        return 404;
    }

    # Performance optimization: Cache static asset assets aggressively
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|otf)$ {
        expires max;
        log_not_found off;
        access_log off;
    }

    # Stream Nginx virtual host logs directly to stdout/stderr
    error_log /dev/stderr;
    access_log /dev/stdout;
}
