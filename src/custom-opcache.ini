; Customize the PHP-OPcache extension
; Location: /usr/local/etc/php/conf.d/custom-opcache.ini

; Enable Opcache for web requests and CLI scripts (like Symfony commands)
opcache.enable=1
opcache.enable_cli=1

; Allocate memory for compiled PHP bytecode (128MB or 256MB is excellent for Symfony)
opcache.memory_consumption=256

; Store unique text strings in a shared buffer to save memory
opcache.interned_strings_buffer=16

; FIXED: Raised to accommodate all Symfony, vendor, and generated cache classes
opcache.max_accelerated_files=20000

; FIXED: CRITICAL FOR KUBERNETES PRODUCTION. 
; Disables timestamp validation completely so files are cached in RAM forever.
opcache.validate_timestamps=0

; The fast_shutdown directive is deprecated/ignored in PHP 8+, 
; but keeping it won't break anything.
opcache.fast_shutdown=1
