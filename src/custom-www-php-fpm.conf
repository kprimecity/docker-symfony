; Essential Production PHP-FPM Pool Configuration
; Location: /usr/local/etc/php-fpm.d/www.conf

[www]
; 1. SYSTEM SECURITY USER CONTEXT
user = www-data
group = www-data

; 2. NETWORK NETWORKING INTERFACE
; Listen on port 9000 across all local interfaces so Nginx can reach it
listen = 127.0.0.1:9000

; 3. YOUR CUSTOM PERFORMANCE TUNING
pm = dynamic
pm.max_children = 50
pm.start_servers = 10
pm.min_spare_servers = 5
pm.max_spare_servers = 35
pm.max_requests = 500

; 4. PRODUCTION LOGGING & HEALTH METRICS
; Clear environment variables in FPM workers (good for k8s secret isolation)
clear_env = no

; Catch worker output and pipe it straight to stderr for 'kubectl logs' to see
catch_workers_output = yes
decorate_workers_output = no
