version: 2
updates:
  # 1. Track GitHub Actions Core Dependencies (Grouped to avoid PR spam)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions-dependencies:
        patterns:
          - "*"

  # 2. Track Symfony / Composer Dependencies (Letting them evaluate naturally)
  - package-ecosystem: "composer"
    directory: "src"
    schedule:
      interval: "weekly"
    groups:
      php-dependencies:
        patterns:
          - "*"
