version: 2
updates:
  # 1. Automatically track and check for GitHub Actions updates
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      # Safely bundles all minor/patch action updates into a single collective PR
      github-actions-dependencies:
        patterns:
          - "*"

  # 2. Automatically track and check for Symfony/Composer updates
  - package-ecosystem: "composer"
    # FIXED: Cleared the leading slash to conform to Dependabot относительный directory mapping constraints
    directory: "src"
    schedule:
      interval: "weekly"
    groups:
      # Optional: Bundles your Symfony composer updates together cleanly too!
      php-dependencies:
        patterns:
          - "*"
