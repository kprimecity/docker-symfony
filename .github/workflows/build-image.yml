name: Build and Push Docker-Symfony Image

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*.*.*'
  pull_request:
    branches:
      - main
      - master

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    name: Build & Publish Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      # 1. Check out your repository files
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Set up automated multi-platform builders
      - name: Set up QEMU
        uses: actions/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: actions/setup-buildx-action@v3

      # 3. Log into GitHub Container Registry (GHCR)
      - name: Log in to the Container registry
        if: github.event_name != 'pull_request'
        uses: actions/docker-login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 4. Extract smart tags matching your repository tags
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
            type=sha,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' }}

      # 5. Build and Push the image using your correct folder structure
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          # FIXED: Shifted context paths into your repository's src/ directory
          context: ./src
          file: ./src/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ id.meta.outputs.tags }}
          labels: ${{ id.meta.outputs.labels }}
          build-args: |
            BUILD_DATE=${{ fromJSON(id.meta.outputs.json).labels['org.opencontainers.image.created'] }}
            VERSION=${{ fromJSON(id.meta.outputs.json).labels['org.opencontainers.image.version'] || 'edge' }}
          # Drastically accelerates workflows by leveraging internal GitHub cache builders
          cache-from: type=gha
          cache-to: type=gha,mode=max
