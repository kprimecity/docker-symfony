name: Build and Push Docker-Symfony Image

on:
  push:
    branches:
      - main
      - master
    # FIXED: The workflow will NOT run if ONLY these files are modified
    paths-ignore:
      - 'README.md'
      - 'Config.md'
      - 'LICENSE'
      - 'docs/**'  # Ignores everything inside a docs folder if you make one
  pull_request:
    branches:
      - main
      - master
    paths-ignore:
      - 'README.md'
      - 'Config.md'
      - 'LICENSE'
      - 'docs/**'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    name: Build and Publish Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      # This step stays as actions/ because it belongs to GitHub
      - name: Checkout repository
        uses: actions/checkout@v4

      # FIXED: Swapped from actions/ to docker/
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      # FIXED: Swapped from actions/ to docker/
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # FIXED: Swapped from actions/ to docker/
      - name: Log in to the Container registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # FIXED: Swapped from actions/ to docker/
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,format=short
            type=raw,value=latest

      # FIXED: Swapped from actions/ to docker/
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./src
          file: ./src/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
